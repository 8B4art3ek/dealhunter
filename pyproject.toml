[project]
name = "dealhunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E, F - podstawowe błędy,
# I - sortowanie importów,
# UP - nowoczesna składnia pythona
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
